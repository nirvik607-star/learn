(more wealth decreases total happiness).`,misconception:`Confusing first derivative u'(w) > 0 with second derivative u''(w) < 0.`,explanation:`Marginal utility u'(w) is positive (more wealth is better), but diminishing (u''(w) < 0).`}],correctIndex:0},discrimination:{scenario:`In a 2×2 game between two airlines choosing {High Price, Low Price}, (Low, Low) gives (5, 5), (High, High) gives (10, 10), (Low, High) gives (14, 2), and (High, Low) gives (2, 14).`,confusableWith:`Nash Equilibrium vs. Pareto Optimal Outcome in a Prisoner’s Dilemma`,question:`What is the Nash Equilibrium vs. the Pareto-efficient outcomes in this game?`,options:[{text:`(Low, Low) yielding (5, 5) is the unique Nash Equilibrium (since Low strictly dominates High: 14 > 10 and 5 > 2), whereas (High, High), (Low, High), and (High, Low) are Pareto-efficient.`,whyRightOrWrong:`Crystal clear! If Opponent plays High, Low gets 14 > 10; if Opponent plays Low, Low gets 5 > 2. Both play Low and get (5,5) even though (10,10) makes both better off.`},{text:`(High, High) yielding (10, 10) is the unique Nash Equilibrium because 10 + 10 = 20 is the highest sum.`,whyRightOrWrong:`At (High, High), either airline can unilaterally deviate to Low and jump from 10 to 14!`},{text:`There is no pure-strategy Nash Equilibrium in this game.`,whyRightOrWrong:`(Low, Low) is a pure-strategy Dominant-Strategy Nash Equilibrium.`}],correctIndex:0},cuedRecall:{prompt:`Define Certainty Equivalent (CE), Risk Premium (RP), and Nash Equilibrium, and state why (Cooperate, Cooperate) fails to be a Nash Equilibrium in the one-shot Prisoner’s Dilemma.`,acceptedKeywords:[`u(ce)`,`e[u(w)]`,`e[w] - ce`,`unilateral`,`deviat`,`best response`,`concave`],canonicalAnswer:`CE satisfies u(CE) = E[u(W)]; RP = E[W] - CE (>0 when u'' < 0); a Nash Equilibrium is a mutual best response where no player gains by unilateral deviation; in Prisoner’s Dilemma, each player has a strict incentive to defect from (C, C).`,hints:[`R0: Write the equation connecting u(CE) to the expected utility of the gamble E[u(W)].`,`R1: Once you solve u(CE) = E[u(W)] for CE, how do you compute the Risk Premium RP?`,`R2: RP = E[W] - CE! Now define Nash Equilibrium in terms of unilateral deviation.`,`R3: Proposition: u(CE) = E[u(W)], RP = E[W] - CE; Nash = mutual best response with no profitable unilateral deviation.`,`R4: State: (1) CE formula, (2) RP = E[W] - CE, (3) Nash definition & why Defect beats Cooperate unilaterally.`,`R5: Complete answer: CE is the sure wealth where u(CE) = E[u(W)], and RP = E[W] - CE. A Nash Equilibrium means every player plays a best response (no profitable unilateral deviation); (C,C) fails because defecting unilaterally yields a higher individual payoff.`]},application:{examProblem:`An entrepreneur with utility u(w) = √w has initial wealth $100 and owns a startup ticket that pays $84 (total wealth $184? No—let’s use clean squares: pays either $300 so w_good = $400 with prob 0.5, or loses $64 so w_bad = $36 with prob 0.5). (1) Compute Expected Wealth E[W]. (2) Compute Expected Utility E[u(W)] and Certainty Equivalent CE. (3) Compute the Risk Premium RP and the maximum insurance premium she would pay to guarantee E[W].`,feynmanPrompt:`Walk a classmate through the 3-step recipe for every Expected Utility / Certainty Equivalent exam problem: E[W] -> E[u(W)] -> invert u(CE) -> subtract RP.`,requiredMoves:[{id:`m1`,label:`Compute Expected Wealth: E[W] = 0.5(400) + 0.5(36) = 200 + 18 = $218`,keywords:[`218`,`$218`,`200 + 18`]},{id:`m2`,label:`Compute Expected Utility and invert u(CE) = √CE: E[u(W)] = 0.5(√400) + 0.5(√36) = 0.5(20) + 0.5(6) = 13 utils => CE = 13^2 = $169`,keywords:[`13`,`169`,`$169`,`20`,`6`]},{id:`m3`,label:`Compute Risk Premium: RP = E[W] - CE = $218 - $169 = $49 (she is willing to sacrifice up to $49 of expected value to remove the risk)`,keywords:[`49`,`$49`,`218 - 169`]}],modelSolution:`1) Expected Wealth: E[W] = 0.5($400) + 0.5($36) = $200 + $18 = $218. 2) Expected Utility: E[u(W)] = 0.5·√400 + 0.5·√36 = 0.5(20) + 0.5(6) = 10 + 3 = 13 utils. Setting u(CE) = √CE = 13 gives Certainty Equivalent CE = 13² = $169. 3) Risk Premium: RP = E[W] - CE = $218 - $169 = $49. Because she is indifferent between the risky gamble and $169 for sure, she would pay up to $218 - $169 = $49 above the actuarially fair cost to lock in certainty.`,commonTraps:[`Taking √E[W] = √218 instead of averaging the square roots 0.5√400 + 0.5√36 = 13`,`Forgetting to square E[u(W)] = 13 back into dollars (CE = 13² = $169) before subtracting from E[W] = $218`],hints:[`R0: Follow the 3 steps: (1) Average the dollars for E[W]; (2) Average the square roots for E[u(W)]; (3) Square E[u(W)] to get CE.`,`R1: What is 0.5(400) + 0.5(36)? And what is 0.5(√400) + 0.5(√36)?`,`R2: E[W] = $218, and E[u(W)] = 0.5(20) + 0.5(6) = 13 utils! Now solve √CE = 13.`,`R3: CE = 13² = $169! Now subtract RP = E[W] - CE = 218 - 169.`,`R4: Write: (1) E[W] = $218, (2) E[u(W)] = 13 => CE = $169, (3) RP = $218 - $169 = $49.`,`R5: Complete answer: E[W] = $218; E[u(W)] = 0.5(20) + 0.5(6) = 13 utils, so CE = 13² = $169; Risk Premium RP = $218 - $169 = $49.`]}}}]}],om={0:0,1:38,2:74,3:100},sm={0:`Unseen`,1:`Familiar`,2:`Learned`,3:`Mastered`};function cm(e){return{nodeId:e,tier:0,stabilityHours:18,lastReviewedAt:null,attempts:0,correctStreak:0,unaidedSuccesses:0,hintedSuccesses:0,maxHintRungUsed:0,confidenceHistory:[],probeBracket:`unprobed`,thinkingNotes:[]}}function lm(e,t=Date.now()){if(!e.lastReviewedAt||e.tier===0)return 1;let n=Math.max(0,(t-e.lastReviewedAt)/36e5);if(n<=1.5)return 1;let r=Math.max(6,e.stabilityHours||18),i=2**(-n/r);return Math.max(.45,Math.min(1,i))}function um(e,t,n=Date.now()){let r=t??cm(e.id),i=om[r.tier],a=lm(r,n),o=1,s=!1;if(r.confidenceHistory.length>0){let e=r.confidenceHistory.slice(-4),t=e.filter(e=>!e.correct&&e.confidence>=75).length,n=e.filter(e=>e.correct&&e.confidence>=70).length;t>0&&r.correctStreak<2?(s=!0,o=.85):n>=2?o=1.03:e.every(e=>e.confidence<45)&&(o=.92)}let c=1;r.tier>=2&&(r.unai
