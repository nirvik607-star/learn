    <div id="root"></div>
    <script>
      // Client-Side OpenAI Account Auth & Local Mac Bridge Router for GitHub Pages / Standalone Mode
      (function() {
        const originalFetch = window.fetch.bind(window);
        let standaloneState = {
          activeProvider: 'chatgpt-oauth',
          codexCliAvailable: false,
          claudeCliAvailable: false,
          chatgptOAuthConnected: false,
          openaiKeyConfigured: false,
          anthropicKeyConfigured: false,
          tokenStats: {
            localZeroTokenActions: 0,
            aiAssistedActions: 0,
            estimatedTokensSaved: 0,
            estimatedApiCostUsd: 0
          }
        };

        function getStoredOpenAIToken() {
          try {
            const raw = (window.localStorage.getItem('lh_openai_account_token') || '').trim();
            if (raw.startsWith('{')) {
              const p = JSON.parse(raw);
              return p.access_token || p.token || p.OPENAI_API_KEY || '';
            }
            return raw;
          } catch (e) {
            return '';
          }
        }

        function getStoredKey(k) {
          try {
            return (window.localStorage.getItem(k) || '').trim();
          } catch (e) {
            return '';
          }
        }

        window.fetch = async function(input, init) {
          const url = typeof input === 'string' ? input : (input && input.url) || '';

          // 1. Intercept /api/subscriptions on static GitHub Pages
          if (url.includes('/api/subscriptions')) {
            const openAITok = getStoredOpenAIToken();
            const xaiKey = getStoredKey('lh_xai_key') || getStoredKey('lh_xai_account_token');
            const anthropicKey = getStoredKey('lh_anthropic_key') || getStoredKey('lh_anthropic_account_token');
            const copilotTok = getStoredKey('lh_copilot_token');

            if (init && init.method === 'POST' && init.body) {
              try {
                const req = JSON.parse(init.body);
                if (req.op === 'disconnect') {
                  if (req.providerId === 'chatgpt') window.localStorage.removeItem('lh_openai_account_token');
                  if (req.providerId === 'xai') { window.localStorage.removeItem('lh_xai_key'); window.localStorage.removeItem('lh_xai_account_token'); }
                  if (req.providerId === 'anthropic') { window.localStorage.removeItem('lh_anthropic_key'); window.localStorage.removeItem('lh_anthropic_account_token'); }
                }
              } catch (e) {}
            }

            const nativeList = [
              {
                providerId: 'xai',
                available: true,
                connected: xaiKey.length > 5,
                pending: false,
                allowBackgroundUse: true,
                connectionId: xaiKey.length > 5 ? 'xai-connected' : null
              },
              {
                providerId: 'anthropic',
                available: true,
                connected: anthropicKey.length > 5,
                pending: false,
                allowBackgroundUse: true,
                connectionId: anthropicKey.length > 5 ? 'anthropic-connected' : null
              },
              {
                providerId: 'github-copilot',
                available: true,
                connected: copilotTok.length > 5,
                pending: false,
                allowBackgroundUse: true,
                connectionId: copilotTok.length > 5 ? 'copilot-connected' : null
              }
            ];

            const chatgptObj = {
              available: true,
              pending: false,
              allowBackgroundUse: true,
              activeId: openAITok.length > 5 ? 'chatgpt-account' : null,
              accounts: openAITok.length > 5 ? [{ id: 'chatgpt-account', label: 'ChatGPT / Codex User', plan: 'Pro/Team' }] : [],
              error: null
            };

            return new Response(JSON.stringify({
              chatgpt: chatgptObj,
              native: nativeList,
              value: nativeList
            }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (url.endsWith('/api/ai/status')) {
            const tok = getStoredOpenAIToken();
            const xKey = getStoredKey('lh_xai_key');
            standaloneState.openaiKeyConfigured = tok.length > 12;
            standaloneState.chatgptOAuthConnected = tok.length > 12;
            standaloneState.activeProvider = xKey ? 'xai' : (tok ? 'chatgpt-oauth' : 'local-engine');
            return new Response(JSON.stringify(standaloneState), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (url.includes('/api/ai/configure') || url.includes('/api/ai/config')) {
            return new Response(JSON.stringify({ ok: true, status: standaloneState }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (url.includes('/api/ai/chat') && init && init.body) {
            const xaiKey = getStoredKey('lh_xai_key') || getStoredKey('lh_xai_account_token');
            if (xaiKey && xaiKey.length > 5) {
              try {
                const parsedBody = JSON.parse(init.body);
                parsedBody.model = parsedBody.model || 'grok-beta';
                const xRes = await originalFetch('https://api.x.ai/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + xaiKey },
                  body: JSON.stringify(parsedBody),
                });
                if (xRes.ok) {
                  const data = await xRes.json();
                  const reply = data.choices?.[0]?.message?.content;
                  if (reply) {
                    return new Response(JSON.stringify({ ok: true, reply }), { status: 200, headers: { 'Content-Type': 'application/json' } });
                  }
                }
              } catch (e) {}
            }
            const tok = getStoredOpenAIToken();
            if (tok && tok.length > 12) {
              try {
                return await originalFetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
                  body: init.body,
                });
              } catch (e) {}
            }
            return new Response(JSON.stringify({ ok: false, error: 'No AI key' }), { status: 503, headers: { 'Content-Type': 'application/json' } });
          }

          if (url.includes('/api/ai/tutor') && init && init.body) {
            try {
              const body = JSON.parse(init.body);
              const isStrict = body.mode === 'strict_examiner';
              const title = body.nodeTitle || 'this proposition';
              const truth = body.unconditionalTruth || '';
              const learnerText = body.learnerResponse || body.questionPrompt || '';
              const openAIToken = getStoredOpenAIToken();
              const xaiKey = getStoredKey('lh_xai_key') || getStoredKey('lh_xai_account_token');
              const anthropicKey = getStoredKey('lh_anthropic_key') || getStoredKey('lh_anthropic_account_token');

              // 1. Direct Grok (xAI) if configured
              if (xaiKey && xaiKey.length > 8) {
                try {
                  const xRes = await originalFetch('https://api.x.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + xaiKey
                    },
                    body: JSON.stringify({
                      model: 'grok-2-latest',
                      messages: [
                        { role: 'system', content: isStrict
                            ? 'You are the LearnHarness Strict Examiner for "' + title + '" (truth: ' + truth + '). Challenge vague answers.'
                            : 'You are the LearnHarness Socratic Tutor for "' + title + '" (truth: ' + truth + '). Give a minimal R2 hint.' },
                        { role: 'user', content: learnerText || ('Tutor me on ' + title) }
                      ],
                      max_tokens: 220,
                      temperature: 0.3
                    })
                  });
                  if (xRes.ok) {
                    const xData = await xRes.json();
                    const reply = xData.choices?.[0]?.message?.content;
                    if (reply) {
                      standaloneState.tokenStats.aiAssistedActions += 1;
                      return new Response(JSON.stringify({
                        reply: reply,
                        message: reply,
                        providerUsed: 'Grok (grok-2-latest · Live xAI)',
                        cachedOrZeroToken: false
                      }), { status: 200, headers: { 'Content-Type': 'application/json' } });
                    }
                  }
                } catch (e) {}
              }

              // 2. Direct OpenAI Account / Key if configured
              if (openAIToken && openAIToken.length > 12) {
                const sysPrompt = isStrict
                  ? 'You are the LearnHarness Strict Examiner. Interrogate the student’s explanation of "' + title + '" against the ground truth ("' + truth + '"). Expose any vague hand-waving in 2-3 sharp sentences.'
                  : 'You are the LearnHarness Socratic Coach. Give a minimal R2 structural hint for "' + title + '" (ground truth: "' + truth + '") without spoiling the full answer in 2-3 concise sentences.';

                const oaRes = await originalFetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + openAIToken
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                      { role: 'system', content: sysPrompt },
                      { role: 'user', content: learnerText || ('Help me with ' + title) }
                    ],
                    max_tokens: 220,
                    temperature: 0.3
                  })
                });
                if (oaRes.ok) {
                  const oaData = await oaRes.json();
                  const replyText = oaData.choices && oaData.choices[0] && oaData.choices[0].message && oaData.choices[0].message.content;
                  if (replyText) {
                    standaloneState.tokenStats.aiAssistedActions += 1;
                    return new Response(JSON.stringify({
                      reply: replyText,
                      message: replyText,
                      providerUsed: 'OpenAI Account (gpt-4o-mini · Live)',
                      cachedOrZeroToken: false
                    }), {
                      status: 200,
                      headers: { 'Content-Type': 'application/json' }
                    });
                  }
                }
              }

              // 3. Try local Mac bridge (http://127.0.0.1:5173/api/ai/tutor) if running
              try {
                const localRes = await originalFetch('http://127.0.0.1:5173/api/ai/tutor', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: init.body
                });
                if (localRes.ok) {
                  return localRes;
                }
              } catch (e) {}

              // 4. Fallback to 0-Token Pre-Compiled Socratic Doctrine Engine
              standaloneState.tokenStats.localZeroTokenActions += 1;
              standaloneState.tokenStats.estimatedTokensSaved += 950;
              const fallbackReply = isStrict
                ? '[Strict Examiner Stress-Test]: State the exact causal chain for "' + title + '" without relying on buzzwords. Specifically: what breaks immediately if the upstream premise is violated? Reference invariant: ' + truth
                : '[Socratic Coach (Minimal Hint)]: Pause and trace the causal arrow for "' + title + '". Which boundary condition or invariant governs this transition? Reference anchor: ' + truth;

              return new Response(JSON.stringify({
                reply: fallbackReply,
                message: fallbackReply,
                providerUsed: '0-Token Pre-Compiled Socratic Engine',
                cachedOrZeroToken: true
              }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            } catch (e) {}
          }

          return originalFetch(input, init);
        };
      })();

onalTruthSummary:`All content-based retrieval in attention reduces to measuring vector alignment (dot product Q·K^T), converting scores into a probability distribution (softmax), and taking a weighted average of values (V).`},{id:`u2-training-inference`,number:2,title:`Unit 2: Backpropagation, Residuals & KV Caching`,subtitle:`Gradient highways during training and memory-bandwidth bottlenecks during decoding`,examSharePercent:30,primingSummary:`Training is compute-bound matrix multiplication in parallel; autoregressive generation is memory-bandwidth-bound vector-matrix multiplication one token at a time.`,unconditionalTruthSummary:`Addition distributes gradients equally to all branches (residual highway), while caching past Keys and Values turns O(N^2) per-step recomputation into O(N) per-step memory reads.`},{id:`u3-agent-harnesses`,number:3,title:`Unit 3: Agent Harness Engineering & Pedagogical Loops`,subtitle:`Why harness architecture moves agent performance more than model swaps`,examSharePercent:25,primingSummary:`An LLM is a stateless next-token predictor; the harness supplies durable state, bounded context, verification gates, and dependency-aware planning.`,unconditionalTruthSummary:`Every effective harness separates state persistence (knowledge graph / memory) from per-turn working context so errors surface immediately at the single step where they occur.`}],nodes:[{id:`dot-product-alignment`,unitId:`u1-attention`,title:`Query-Key Dot Product as Content Addressing`,statement:`The dot product q_i · k_j measures directional alignment between what token i looks for (Query) and what token j advertises (Key), acting as a differentiable dictionary lookup.`,isUnconditionalTruth:!0,prerequisites:[],examWeight:5,motivatedHook:`In a Python dict, dict[key] requires an exact match. How could we design a lookup table where a query blends multiple entries smoothly based on how relevant each key is?`,predictionPrompt:{question:`If we want every token to retrieve a weighted blend of values from relevant tokens without hard if/else branches, what mathematical operation naturally scores similarity between two d-dimensional vectors?`,options:[`Inner (dot) product q_i · k_j, which is positive when vectors point in similar directions and zero when orthogonal`,`Element-wise subtraction q_i - k_j summed without squaring`,`Taking the determinant of the concatenated vectors`,`Sorting the vectors alphabetically by magnitude`],correctIndex:0,resolution:`Exactly! The inner product q_i · k_j = ||q_i|| ||k_j|| cos(θ) directly measures alignment and is a single fast matrix multiply QK^T across all token pairs.`},teachingStep:{coreExplanation:`Each input embedding x_i is projected into three distinct roles using learned matrices: Query (q_i = x_i W_Q: "what I am searching for"), Key (k_j = x_j W_K: "what label I advertise"), and Value (v_j = x_j W_V: "the payload I hand over if selected"). Separating Query and Key allows asymmetric relationships—for example, a verb searching for its subject does not mean the subject searches identically for the verb.`,visualMentalModel:`[Token i: x_i] ──W_Q──> q_i (Search Query)

ble the parameter count.`,misconception:`Assuming K and V share weights.`,explanation:`W_K and W_V are distinct learned projection matrices serving addressing vs. payload roles.`},{text:`Keys gate gradient flow during backprop, while Values are only used during inference.`,misconception:`Confusing forward addressing with training/inference phases.`,explanation:`Both K and V participate in both training and inference.`}],correctIndex:0},discrimination:{scenario:`Suppose an engineer ties W_Q = W_K (using the exact same projection matrix for Queries and Keys) in a single-head attention layer.`,confusableWith:`Full asymmetric Query-Key projection (W_Q ≠ W_K)`,question:`What structural capability does this layer immediately lose compared to standard attention?`,options:[{text:`The score matrix S = QK^T becomes symmetric (s_ij = s_ji), so token i cannot attend strongly to token j without token j paying the exact same raw score to token i.`,whyRightOrWrong:`Correct! If Q = K, then QK^T = QQ^T, which is symmetric (S = S^T) and positive semi-definite.`},{text:`The softmax rows will no longer sum to 1.0.`,whyRightOrWrong:`Incorrect: softmax normalizes any real-valued row to sum to 1.0 regardless of symmetry.`},{text:`The time complexity drops from O(N^2) to O(N).`,whyRightOrWrong:`Incorrect: multiplying N×d by d×N still requires O(N^2 d) operations.`}],correctIndex:0},cuedRecall:{prompt:`State the three projection vectors created for each token in self-attention and explain why Query and Key must be separate projections.`,acceptedKeywords:[`query`,`key`,`value`,`asymmetric`,`symmetric`,`lookup`,`address`],canonicalAnswer:`Query (search target), Key (address label), and Value (transferred content); separate W_Q and W_K enable asymmetric directed attention (s_ij ≠ s_ji).`,hints:[`R0: Think of a database search: what you type in, the index label matched, and the record returned.`,`R1: Name the 3 vectors (Q, K, V) and consider what happens to QK^T if Q = K.`,`R2: Focus on matrix oftmax normalizes across all Keys j for a fixed Query i`],hints:[`R0: Trace the exact path of the token "it" through W_Q, W_K, softmax, and W_V.`,`R1: Which vector belongs to "it", and which vectors belong to "trophy" and "suitcase"?`,`R2: Separate the scoring phase (Q with K) from the feature-routing phase (weights with V).`,`R3: Remember: α_it,trophy = softmax(q_it · k_trophy / √d_k), which then weights v_trophy.`,`R4: State all 3 steps: (1) q_it from W_Q, (2) high dot product with k_trophy, (3) weighted sum of v_trophy via softmax.`,`R5: Full worked chain: "it" emits Query q_it; dot product q_it · k_trophy beats k_suitcase; softmax assigns high weight α to trophy; output pulls v_trophy.`]}}},{id:`scaled-variance-softmax`,unitId:`u1-attention`,title:`Variance Scaling (1/√d_k) & Softmax Gradient Saturation`,statement:`If q and k have independent zero-mean, unit-variance components, their dot product has variance d_k; dividing by √d_k restores unit variance so softmax does not saturate into near-zero gradients.`,isUnconditionalTruth:!1,prerequisites:[`dot-product-alignment`],examWeight:5,motivatedHook:`When head dimension d_k grows from 64 to 512, training suddenly stalls right at initialization. What happens to the sum of d_k random products, and what does that do to exp(z) inside softmax?`,predictionPrompt:{question:`If each component q_m and k_m has mean 0 and variance 1, what is the variance of their d_k-dimensional dot product Σ_{m=1}^{d_k} q_m k_m?`,options:[`Variance equals d_k (standard deviation √d_k), because the variances of d_k independent terms add linearly`,`Variance stays 1.0 regardless of d_k because positive and negative terms cancel out completely`,`Variance equals d_k^2`,`Variance equals 1 / d_k`],correctIndex:0,resolution:`Yes! While the mean stays 0, Var(Σ q_m k_m) = Σ Var(q_m k_m) = d_k. So typical dot products have magnitude ~√d_k, pushing softmax into flat tails unless we divide by √d_k!`},teachingStep:{coreExplanation:`For independent random variables with mean 0 and variance 1, each product q_m k_m has mean 0 and variance 1. Summing d_k independent terms yields Var(q · k) = d_k, meaning standard deviation is √d_k. If d_k = 256, raw logits swing by ±16! Passing ±16 into softmax(z)_i = e^{z_i} / Σ e^{z_j} makes the largest logit take ~0.999999 of the probability mass. Because the Jacobian of softmax contains α_i(1 - α_i), when α_i ≈ 1 or 0, gradients vanish to ~0 and Q/K projections freeze.`,visualMentalModel:`Unscaled (d_k=256): q·k ~ N(0, 256) (std=16) ──> Softmax: [0.9999, 0.0001, 0.0000] ──> ∂L/∂z ∝ α(1-α) ≈ 0 (DEAD GRADIENTS)

spect to logit z_j.`,`R1: What is the derivative of Σ α_j v_j with respect to v_j when α_1 = 1?`,`R2: Notice ∂Out/∂v_1 = α_1 = 1, while ∂α_1/∂z_1 = α_1(1 - α_1) = 0!`,`R3: Combine the variance proof Var(q·k / √d_k) = (1/d_k) d_k = 1 with the Jacobian split between V and Q/K.`,`R4: Write: (1) Var(q_i k_i)=1 => Var(q·k)=d_k; (2) Var(/√d_k)=1; (3) α(1-α)→0 kills Q/K gradients, while α_winner≈1 still passes gradient to W_V.`,`R5: Complete derivation: Independent unit-variance terms sum to variance d_k; dividing by √d_k scales variance by 1/d_k back to 1. Saturated softmax has zero derivative α(1-α)=0 for Q/K, but passes weight α=1 directly to the winning V.`]}}},{id:`quadratic-vs-linear-attention`,unitId:`u1-attention`,title:`Quadratic O(N²d) Bottleneck vs. Linear Attention Associativity`,statement:`Standard attention computes softmax(QK^T)V in O(N²d) because softmax couples all N×N token pairs before multiplying V; linear attention drops softmax to associate Q(K^T V) in O(N d²), trading sharp token-specific lookup for fixed-size summary compression.`,isUnconditionalTruth:!1,prerequisites:[`dot-product-alignment`,`scaled-variance-softmax`],examWeight:4,motivatedHook:`Why does doubling context length N quadruple attention compute, and what single mathematical barrier stops us from just multiplying K^T V first?`,predictionPrompt:{question:`In the product (Q K^T) V where Q, K, V ∈ R^{N × d}, why can’t standard Transformer attention simply use matrix associativity Q (K^T V) to reduce complexity from O(N²d) to O(Nd²)?`,options:[`Because the non-linear element-wise softmax(.) sits around softmax(Q K^T), preventing us from factoring K^T V first`,`Because matrix multiplication is never associative when N > d`,`Because V has a different sequence length N than K`,`Because GPUs cannot multiply d × N by N × d matrices`],correctIndex:0,resolution:`Spot on! Without softmax, (QK^T)V = Q(K^T V). The non-linear softmax(QK^T) forces materializing the N×N score matrix first unless we replace exp(q·k) with a separable kernel φ(q)φ(k)^T!`},teachingStep:{coreExplanation:`In standard attention, Q, K, V have shape (N × d). Forming S = QK^T produces an (N × N) matrix in O(N²d) time and O(N²) memory. If we replace softmax(q_i · k_j) with a decomposable feature map φ(q_i) · φ(k_j)^T, then by matrix associativity: (φ(Q) φ(K)^T) V = φ(Q) (φ(K)^T V). Here M = φ(K)^T V is a fixed (d × d) state matrix computed in O(N d²)! However, compressing N tokens into a fixed d × d matrix loses exact needle-in-a-haystack resolution when N ≫ d.`,visualMentalModel:`Standard: [Q (N×d) · K^T (d×N)] ──> Softmax (N×N) · V (N×d) ===> O(N²d) time, sharp exact retrieval

c O(N²) scaling.`}],correctIndex:0},discrimination:{scenario:`You are designing an model that must copy an exact 16-digit UUID mentioned 50,000 tokens earlier ("needle in a haystack").`,confusableWith:`Full Softmax Attention vs. Pure Linear Attention (fixed d×d state)`,question:`Which architecture struggles on exact long-range copying and why?`,options:[{text:`Pure Linear Attention struggles because its fixed d×d state (φ(K)^T V) has finite rank ≤ d and lacks the exponential sharpness of softmax to isolate one exact past token out of 50,000.`,whyRightOrWrong:`Correct! Softmax can concentrate ~100% weight on a single token across N=50,000 because it keeps all N keys distinct; linear attention superposes them into d×d.`},{text:`Full Softmax Attention struggles because O(N²) matrices cannot represent identity mappings.`,whyRightOrWrong:`Full softmax attention excels at exact induction-head copying.`},{text:`Both fail equally because dot products cannot compare token embeddings.`,whyRightOrWrong:`Full attention solves needle-in-a-haystack reliably.`}],correctIndex:0},cuedRecall:{prompt:`Write the matrix parenthesization trick used by Linear Attention, its asymptotic complexity, and the fundamental representation tradeoff it makes.`,acceptedKeywords:[`associativ`,`d^2`,`nd^2`,`softmax`,`bottleneck`,`fixed`,`sharp`],canonicalAnswer:`Reorders (φ(Q)φ(K)^T)V to φ(Q)(φ(K)^T V) reducing O(N²d) to O(Nd²), trading sharp unbounded N×N lookup for a lossy fixed-size d×d state.`,hints:[`R0: Compare the matrix shapes of (QK^T)V vs. Q(K^T V).`,`R1: What is the shape of K^T V when K and V are both N × d?`,`R2: K^T V has shape d × d! What stops us from doing that in standard attention?`,`R3: Proposition: Replacing softmax with φ(Q)φ(K)^T unlocks associativity φ(Q)(φ(K)^T V) in O(Nd²), compressing history into a d×d state.`,`R4: State: (1) Associative product φ(Q)(φ(K)^T V), (2) O(Nd²) runtime, (3) lossy d×d superposition vs sharp softmax.`,`R5: Complete answer: Linear attention drops non-linear softmax for φ(Q)(φ(K)^T V), cutting complexity from O(N²d) to O(Nd²) at the cost of compressing all N tokens into a fixed d×d matrix.`]},application:{examProblem:`Derive the exact FLOP scaling of (QK^T)V versus Q(K^T V) for Q, K, V ∈ R^{N×d} when N = 32,768 and d = 64. Explain why standard attention cannot use the second order directly and how Linear Attention’s d×d state behaves like an RNN during inference.`,feynmanPrompt:`Explain why parentheses placement in matrix multiplication is the difference between a 10-second response and running out of GPU memory.`,requiredMoves:[{id:`m1`,label:`Calculate shapes & FLOPs: (QK^T)V forms an N×N intermediate taking ~2N²d ops, whereas Q(K^T V) forms a d×d intermediate taking ~2Nd² ops (512× fewer when N=32768, d=64)`,keywords:[`n^2`,`nd^2`,`d×d`,`n×n`,`512`,`shape`,`intermediate`]},{id:`m2`,label:`Explain that row-wise non-linear softmax(QK^T) prevents factoring K^T V unless replaced by a kernel feature map φ(q)φ(k)^T`,keywords:[`softmax`,`non-linear`,`kernel`,`separable`,`factor`]},{id:`m3`,label:`Show that during autoregressive inference, S_t = S_{t-1} + φ(k_t)v_t^T updates in O(d²) constant memory like an RNN, losing exact recall when N ≫ d`,keywords:[`recurrent`,`rnn`,`s_t`,`constant memory`,`lossy`,`superpos`]}],modelSolution:`1) For Q, K, V ∈ R^{N×d}: (QK^T) produces an N×N matrix in O(N²d) FLOPs, then multiplies V in O(N²d). By contrast, (K^T V) multiplies (d×N)(N×d) into a (d×d) matrix in O(Nd²), then Q(K^T V) takes O(Nd²). With N=32,768 and d=64, N/d = 512× faster! 2) Standard attention applies element-wise exp() and row normalization across QK^T, which does not factor across the matrix product. Linear attention substitutes φ(q_i)φ(k_j)^T. 3) At inference, the cumulative state S_t = Σ_{j≤t} φ(k_j) v_j^T ∈ R^{d×d} updates recurrently in O(d²) time and memory per token, but acts as a finite-capacity associative memory that blurs sharp lookups over long contexts.`,commonTraps:[`Writing that K^T V has shape N×N arries the upstream gradient ∂L/∂y straight back!`},teachingStep:{coreExplanation:`In plain deep networks y_L = f_L(f_{L-1}(...f_1(x))), the chain rule multiplies Jacobians: ∂y_L/∂x = Π_{l=1}^L ∂f_l/∂x_{l-1}. If each spectral norm is 0.8 across 100 layers, 0.8^{100} ≈ 2×10^{-10} (vanishing gradient). With residual blocks x_l = x_{l-1} + F_l(x_{l-1}), unrolling from layer l to L gives x_L = x_l + Σ_{m=l+1}^L F_m(x_{m-1}). Differentiating yields ∂L/∂x_l = ∂L/∂x_L · (I + ∂/∂x_l Σ F_m). The direct additive term ∂L/∂x_L reaches layer l untouched by intermediate multiplicative decay!`,visualMentalModel:`Forward:  x_{l-1} ──┬───────────────(+)──> x_l = x_{l-1} + F(x_{l-1})
