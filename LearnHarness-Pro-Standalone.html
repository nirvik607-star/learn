  <body>
    <div id="root"></div>
    <script>
      // Client-Side OpenAI Account Auth & Local Mac Bridge Router for GitHub Pages / Standalone Mode
      (function() {
        const originalFetch = window.fetch.bind(window);
        let standaloneState = {
          activeProvider: 'chatgpt-oauth',
          codexCliAvailable: false,
          claudeCliAvailable: false,
          chatgptOAuthConnected: false,
          openaiKeyConfigured: false,
          anthropicKeyConfigured: false,
          tokenStats: {
            localZeroTokenActions: 0,
            aiAssistedActions: 0,
            estimatedTokensSaved: 0,
            estimatedApiCostUsd: 0
          }
        };

        function getStoredOpenAIToken() {
          try {
            const raw = (window.localStorage.getItem('lh_openai_account_token') || '').trim();
            if (raw.startsWith('{')) {
              const p = JSON.parse(raw);
              return p.access_token || p.token || p.OPENAI_API_KEY || '';
            }
            return raw;
          } catch (e) {
            return '';
          }
        }

        window.fetch = async function(input, init) {
          const url = typeof input === 'string' ? input : (input && input.url) || '';

          if (url.endsWith('/api/ai/status')) {
            const tok = getStoredOpenAIToken();
            standaloneState.openaiKeyConfigured = tok.length > 12;
            standaloneState.chatgptOAuthConnected = tok.length > 12;
            return new Response(JSON.stringify(standaloneState), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (url.includes('/api/ai/configure') || url.includes('/api/ai/config')) {
            return new Response(JSON.stringify({ ok: true, status: standaloneState }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          if (url.includes('/api/ai/tutor') && init && init.body) {
            try {
              const body = JSON.parse(init.body);
              const isStrict = body.mode === 'strict_examiner';
              const title = body.nodeTitle || 'this proposition';
              const truth = body.unconditionalTruth || '';
              const learnerText = body.learnerResponse || body.questionPrompt || '';
              const openAIToken = getStoredOpenAIToken();

              // 1. If OpenAI Account Token or API Key is stored in browser, route live through OpenAI!
              if (openAIToken && openAIToken.length > 12) {
                const sysPrompt = isStrict
                  ? 'You are the LearnHarness Strict Examiner. Interrogate the student’s explanation of "' + title + '" against the ground truth ("' + truth + '"). Expose any vague hand-waving in 2-3 sharp sentences.'
                  : 'You are the LearnHarness Socratic Coach. Give a minimal R2 structural hint for "' + title + '" (ground truth: "' + truth + '") without spoiling the full answer in 2-3 concise sentences.';

                const oaRes = await originalFetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + openAIToken
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                      { role: 'system', content: sysPrompt },
                      { role: 'user', content: learnerText || ('Help me with ' + title) }
                    ],
                    max_tokens: 220,
                    temperature: 0.3
                  })
                });
                if (oaRes.ok) {
                  const oaData = await oaRes.json();
                  const replyText = oaData.choices && oaData.choices[0] && oaData.choices[0].message && oaData.choices[0].message.content;
                  if (replyText) {
                    standaloneState.tokenStats.aiAssistedActions += 1;
                    return new Response(JSON.stringify({
                      reply: replyText,
                      message: replyText,
                      providerUsed: 'OpenAI Account (gpt-4o-mini · Live)',
                      cachedOrZeroToken: false
                    }), {
                      status: 200,
                      headers: { 'Content-Type': 'application/json' }
                    });
                  }
                }
              }

              // 2. Try local Mac bridge (http://127.0.0.1:5173/api/ai/tutor) if running
              try {
                const localRes = await originalFetch('http://127.0.0.1:5173/api/ai/tutor', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: init.body
                });
                if (localRes.ok) {
                  return localRes;
                }
              } catch (e) {}

              // 3. Fallback to 0-Token Pre-Compiled Socratic Doctrine Engine
              standaloneState.tokenStats.localZeroTokenActions += 1;
              standaloneState.tokenStats.estimatedTokensSaved += 950;
              const fallbackReply = isStrict
                ? '[Strict Examiner Stress-Test]: State the exact causal chain for "' + title + '" without relying on buzzwords. Specifically: what breaks immediately if the upstream premise is violated? Reference invariant: ' + truth
                : '[Socratic Coach (Minimal Hint)]: Pause and trace the causal arrow for "' + title + '". Which boundary condition or invariant governs this transition? Reference anchor: ' + truth;

              return new Response(JSON.stringify({
                reply: fallbackReply,
                message: fallbackReply,
                providerUsed: '0-Token Pre-Compiled Socratic Engine',
                cachedOrZeroToken: true
              }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            } catch (e) {}
          }

          return originalFetch(input, init);
        };
      })();
    </script>

ltiplication in parallel; autoregressive generation is memory-bandwidth-bound vector-matrix multiplication one token at a time.`,unconditionalTruthSummary:`Addition distributes gradients equally to all branches (residual highway), while caching past Keys and Values turns O(N^2) per-step recomputation into O(N) per-step memory reads.`},{id:`u3-agent-harnesses`,number:3,title:`Unit 3: Agent Harness Engineering & Pedagogical Loops`,subtitle:`Why harness architecture moves agent performance more than model swaps`,examSharePercent:25,primingSummary:`An LLM is a stateless next-token predictor; the harness supplies durable state, bounded context, verification gates, and dependency-aware planning.`,unconditionalTruthSummary:`Every effective harness separates state persistence (knowledge graph / memory) from per-turn working context so errors surface immediately at the single step where they occur.`}],nodes:[{id:`dot-product-alignment`,unitId:`u1-attention`,title:`Query-Key Dot Product as Content Addressing`,statement:`The dot product q_i · k_j measures directional alignment between what token i looks for (Query) and what token j advertises (Key), acting as a differentiable dictionary lookup.`,isUnconditionalTruth:!0,prerequisites:[],examWeight:5,motivatedHook:`In a Python dict, dict[key] requires an exact match. How could we design a lookup table where a query blends multiple entries smoothly based on how relevant each key is?`,predictionPrompt:{question:`If we want every token to retrieve a weighted blend of values from relevant tokens without hard if/else branches, what mathematical operation naturally scores similarity between two d-dimensional vectors?`,options:[`Inner (dot) product q_i · k_j, which is positive when vectors point in similar directions and zero when orthogonal`,`Element-wise subtraction q_i - k_j summed without squaring`,`Taking the determinant of the concatenated vectors`,`Sorting the vectors alphabetically by magnitude`],correctIndex:0,resolution:`Exactly! The inner product q_i · k_j = ||q_i|| ||k_j|| cos(θ) directly measures alignment and is a single fast matrix multiply QK^T across all token pairs.`},teachingStep:{coreExplanation:`Each input embedding x_i is projected into three distinct roles using learned matrices: Query (q_i = x_i W_Q: "what I am searching for"), Key (k_j = x_j W_K: "what label I advertise"), and Value (v_j = x_j W_V: "the payload I hand over if selected"). Separating Query and Key allows asymmetric relationships—for example, a verb searching for its subject does not mean the subject searches identically for the verb.`,visualMentalModel:`[Token i: x_i] ──W_Q──> q_i (Search Query)
[Token j: x_j] ──W_K──> k_j (Index Label)  ===> Score s_ij = q_i · k_j ===> Softmax weight α_ij ===> Σ α_ij v_j`,keyFormulaOrRule:`Attention(Q, K, V) = softmax(Q K^T / √d_k) V`,checkQuestion:{question:`Why does self-attention project each token into separate Query (W_Q) and Key (W_K) spaces instead of just computing x_i · x_j directly?`,options:[{text:`Because x_i · x_j is always symmetric (s_ij = s_ji) and forces a token to attend most strongly to itself, whereas separate W_Q and W_K allow asymmetric directed lookups.`,diagnosticFeedback:`Spot on! Relevance in language is asymmetric ("chased" looks for its subject noun differently than the noun looks for modifiers).`},{text:`Because dot products cannot be computed on raw embeddings x_i without first making their dimensions prime numbers.`,misconceptionTag:`dimension-myth`,diagnosticFeedback:`Dot products work on any matching dimension d. The issue with x_i · x_j is symmetry and lack of role separation.`},{text:`To prevent backpropagating gradients into the token embedding table.`,misconceptionTag:`gradient-block`,diagnosticFeedback:`Gradients flow straight through W_Q, W_K, and W_V back into the token embeddings.`}],correctIndex:0}},quizletStages:{recognition:{question:`In the Transformer attention mechanism, what distinct role do the Key vectors (K) and Value vectors (V) play?`,options:[{text:`Keys are matched against Queries to compute attention weights α_ij, while Values hold the actual feature content summed using those weights.`,misconception:`None`,explanation:`Keys determine *how much* attention is paid; Values provide *what information* is passed forward.`},{text:`Keys store the output probabilities for the vocabulary, while Values store the positional encoding.`,misconception:`Confusing attention K/V with the final LM head and positional embeddings.`,explanation:`Vocabulary logits are only produced at the final linear unembedding layer.`},{text:`Keys and Values are identical matrices used twice only to double the parameter count.`,misconception:`Assuming K and V share weights.`,explanation:`W_K and W_V are distinct learned projection matrices serving addressing vs. payload roles.`},{text:`Keys gate gradient flow during backprop, while Values are only used during inference.`,misconception:`Confusing forward addressing with training/inference phases.`,explanation:`Both K and V participate in both training and inference.`}],correctIndex:0},discrimination:{scenario:`Suppose an engineer ties W_Q = W_K (using the exact same projection matrix for Queries and Keys) in a single-head attention layer.`,confusableWith:`Full asymmetric Query-Key projection (W_Q ≠ W_K)`,question:`What structural capability does this layer immediately lose compared to standard attention?`,options:[{text:`The score matrix S = QK^T becomes symmetric (s_ij = s_ji), so token i cannot attend strongly to token j without token j paying the exact same raw score to token i.`,whyRightOrWrong:`Correct! If Q = K, then QK^T = QQ^T, which is symmetric (S = S^T) and positive semi-definite.`},{text:`The softmax rows will no longer sum to 1.0.`,whyRightOrWrong:`Incorrect: softmax normalizes any real-valued row to sum to 1.0 regardless of symmetry.`},{text:`The time complexity drops from O(N^2) to O(N).`,whyRightOrWrong:`Incorrect: multiplying N×d by d×N still requires O(N^2 d) operations.`}],correctIndex:0},cuedRecall:{prompt:`State the three projection vectors created for each token in self-attention and explain why Query and Key must be separate projections.`,acceptedKeywords:[`query`,`key`,`value`,`asymmetric`,`symmetric`,`lookup`,`address`],canonicalAnswer:`Query (search target), Key (address label), and Value (transferred content); separate W_Q and W_K enable asymmetric directed attention (s_ij ≠ s_ji).`,hints:[`R0: Think of a database search: what you type in, the index label matched, and the record returned.`,`R1: Name the 3 vectors (Q, K, V) and consider what happens to QK^T if Q = K.`,`R2: Focus on matrix symmetry: if Q = K, then s_ij = q_i · q_j = s_ji.`,`R3: Proposition: Separate W_Q and W_K projections break symmetry so token i can attend to j without j attending equally to i.`,`R4: Write: (1) Query, Key, Value; (2) Q·K^T computes alignment scores; (3) W_Q ≠ W_K permits asymmetric relationships.`,`R5: Complete answer: Tokens project to Query, Key, and Value. Separate W_Q and W_K allow asymmetric attention scores (s_ij ≠ s_ji) rather than forcing symmetric self-similarity.`]},application:{examProblem:`In the sentence "The trophy did not fit in the brown suitcase because it was too big", explain step-by-step how a single self-attention head resolves the pronoun "it" to "trophy" using Q, K, and V.`,feynmanPrompt:`Explain to a smart sophomore why a Transformer needs THREE matrices (Q, K, V) instead of just one, using a real-world analogy and no hand-waving.`,requiredMoves:[{id:`m1`,label:`Project "it" into a Query vector encoding "looking for a large object that failed to fit"`,keywords:[`query`,`it`,`project`,`search`,`looking`]},{id:`m2`,label:`Compute dot products against Keys of candidate nouns ("trophy" vs "suitcase") yielding a higher alignment score for "trophy"`,keywords:[`key`,`dot product`,`trophy`,`score`,`alignment`,`similarity`]},{id:`m3`,label:`Apply softmax and compute the weighted sum of Value vectors so "it" absorbs the semantic features of "trophy"`,keywords:[`softmax`,`value`,`weighted`,`sum`,`features`]}],modelSolution:`1) The token "it" (contextualized by "too big") projects via W_Q into a Query vector searching for an oversized object. 2) Candidate nouns "trophy" and "suitcase" project via W_K into Keys; q_it · k_trophy produces a much larger dot product than q_it · k_suitcase. 3) Softmax concentrates weight α near 1.0 on "trophy", and multiplying by V routes the Value vector v_trophy into the updated representation of "it".`,commonTraps:[`Saying the Query multiplies directly with the Value vector (Queries only dot with Keys!)`,`Forgetting that softmax normalizes across all Keys j for a fixed Query i`],hints:[`R0: Trace the exact path of the token "it" through W_Q, W_K, softmax, and W_V.`,`R1: Which vector belongs to "it", and which vectors belong to "trophy" and "suitcase"?`,`R2: Separate the scoring phase (Q with K) from the feature-routing phase (weights with V).`,`R3: Remember: α_it,trophy = softmax(q_it · k_trophy / √d_k), which then weights v_trophy.`,`R4: State all 3 steps: (1) q_it from W_Q, (2) high dot product with k_trophy, (3) weighted sum of v_trophy via softmax.`,`R5: Full worked chain: "it" emits Query q_it; dot product q_it · k_trophy beats k_suitcase; softmax assigns high weight α to trophy; output pulls v_trophy.`]}}},{id:`scaled-variance-softmax`,unitId:`u1-attention`,title:`Variance Scaling (1/√d_k) & Softmax Gradient Saturation`,statement:`If q and k have independent zero-mean, unit-variance components, their dot product has variance d_k; dividing by √d_k restores unit variance so softmax does not saturate into near-zero gradients.`,isUnconditionalTruth:!1,prerequisites:[`dot-product-alignment`],examWeight:5,motivatedHook:`When head dimension d_k grows from 64 to 512, training suddenly stalls right at initialization. What happens to the sum of d_k random products, and what does that do to exp(z) inside softmax?`,predictionPrompt:{question:`If each component q_m and k_m has mean 0 and variance 1, what is the variance of their d_k-dimensional dot product Σ_{m=1}^{d_k} q_m k_m?`,options:[`Variance equals d_k (standard deviation √d_k), because the variances of d_k independent terms add linearly`,`Variance stays 1.0 regardless of d_k because positive and negative terms cancel out completely`,`Variance equals d_k^2`,`Variance equals 1 / d_k`],correctIndex:0,resolution:`Yes! While the mean stays 0, Var(Σ q_m k_m) = Σ Var(q_m k_m) = d_k. So typical dot products have magnitude ~√d_k, pushing softmax into flat tails unless we divide by √d_k!`},teachingStep:{coreExplanation:`For independent random variables with mean 0 and variance 1, each product q_m k_m has mean 0 and variance 1. Summing d_k independent terms yields Var(q · k) = d_k, meaning standard deviation is √d_k. If d_k = 256, raw logits swing by ±16! Passing ±16 into softmax(z)_i = e^{z_i} / Σ e^{z_j} makes the largest logit take ~0.999999 of the probability mass. Because the Jacobian of softmax contains α_i(1 - α_i), when α_i ≈ 1 or 0, gradients vanish to ~0 and Q/K projections freeze.`,visualMentalModel:`Unscaled (d_k=256): q·k ~ N(0, 256) (std=16) ──> Softmax: [0.9999, 0.0001, 0.0000] ──> ∂L/∂z ∝ α(1-α) ≈ 0 (DEAD GRADIENTS)
Scaled (/√d_k):     q·k/√d_k ~ N(0, 1) (std=1) ──> Softmax: [0.52,   0.31,   0.17  ] ──> Healthy Gradients!`,keyFormulaOrRule:`Var(q · k) = d_k  ===>  Var((q · k) / √d_k) = d_k / (√d_k)^2 = 1`,checkQuestion:{question:`Why do we divide the dot product by √d_k specifically rather than by d_k itself?`,options:[{text:`Because scaling a random variable by a constant c scales its standard deviation by c and its variance by c^2; dividing by √d_k divides the variance by (√d_k)^2 = d_k, restoring Var = 1.`,diagnosticFeedback:`Exact mathematical derivation: Var(X / c) = Var(X) / c^2 = d_k / d_k = 1.`},{text:`Because dividing by d_k would make all dot products negative.`,misconceptionTag:`sign-confusion`,diagnosticFeedback:`d_k is a positive integer, so dividing by it never flips signs; it would just over-shrink variance to 1/d_k.`},{text:`Because √d_k is the L2 norm of the Value vector V.`,misconceptionTag:`norm-confusion`,diagnosticFeedback:`√d_k is a fixed architectural constant based on Key/Query dimension, not the runtime norm of V.`}],correctIndex:0}},quizletStages:{recognition:{question:`What is the direct consequence of omitting the 1/√d_k scaling factor in Scaled Dot-Product Attention when d_k is large?`,options:[{text:`Dot-product magnitudes grow as √d_k, pushing softmax into saturation (α_i → 0 or 1) where gradients α_i(1 - α_i) vanish.`,misconception:`None`,explanation:`Large logit gaps saturate softmax into a near-one-hot argmax with zero slope.`},{text:`The attention matrix becomes non-invertible, causing a runtime divide-by-zero exception.`,misconception:`Thinking attention inverts QK^T.`,explanation:`Attention never inverts QK^T; it applies row-wise softmax.`},{text:`The Value vectors V explode to infinity during the forward pass.`,misconception:`Confusing softmax saturation with unbounded output explosion.`,explanation:`Softmax weights still sum to 1, so the output remains a convex combination of V—the problem is vanishing gradients into Q and K!`},{text:`The  -> avoids softmax saturation / vanishing gradients.`,`R5: Complete answer: Each q_m k_m has variance 1, so Var(q·k) = d_k. Dividing by √d_k divides variance by d_k (back to 1), preventing extreme logits from saturating softmax and killing gradients.`]},application:{examProblem:`Prove that if q, k ∈ R^{d_k} have independent components with E[q_i]=E[k_i]=0 and Var(q_i)=Var(k_i)=1, then Var(q·k / √d_k) = 1. Then explain why softmax saturation stops W_Q and W_K from learning while W_V can still receive gradients.`,feynmanPrompt:`Explain why dividing by √d_k is the thermostat of Transformer attention, and why W_V still gets gradients when W_Q and W_K freeze.`,requiredMoves:[{id:`m1`,label:`Show E[q_i k_i] = 0 and Var(q_i k_i) = E[q_i^2]E[k_i^2] = 1, so summing d_k independent terms gives Var(q·k) = d_k`,keywords:[`independent`,`sum`,`var`,`d_k`,`unit`]},{id:`m2`,label:`Apply Var(aX) = a^2 Var(X) with a = 1/√d_k to get (1/d_k)·d_k = 1`,keywords:[`1/d_k`,`square`,`sqrt`,`restore`,`constant`]},{id:`m3`,label:`Explain that saturated softmax (α ≈ 1 or 0) has Jacobian α(1-α) ≈ 0 blocking gradients to Q and K, whereas ∂(αV)/∂V = α still passes gradient to the winning Value v_j`,keywords:[`jacobian`,`alpha`,`vanish`,`w_v`,`value`,`saturat`]}],modelSolution:`1) Since q_i, k_i are independent with mean 0 and variance 1, E[q_i k_i] = E[q_i]E[k_i] = 0 and Var(q_i k_i) = E[q_i^2]E[k_i^2] = 1·1 = 1. By independence across i=1..d_k, Var(Σ q_i k_i) = d_k. 2) Scaling by 1/√d_k multiplies variance by (1/√d_k)^2 = 1/d_k, yielding Var = 1. 3) Without scaling, one α_ij ≈ 1 and others ≈ 0. Since Output = Σ α_ij v_j, ∂Out/∂v_j = α_ij ≈ 1 for the winning token (so W_V still receives gradient!), but ∂α/∂logits ∝ α(1-α) ≈ 0, completely starving W_Q and W_K of gradients.`,commonTraps:[`Claiming W_V also gets zero gradient when softmax saturates to a one-hot vector`,`Forgetting that Var(cX) = c^2 Var(X)`],hints:[`R0: Look closely at Output = Σ α_j v_j. Differentiate with respect to v_j vs. with respect to logit z_j.`,`R1: What is the derivative of Σ α_j v_j with respect to v_j when α_1 = 1?`,`R2: Notice ∂Out/∂v_1 = α_1 = 1, while ∂α_1/∂z_1 = α_1(1 - α_1) = 0!`,`R3: Combine the variance proof Var(q·k / √d_k) = (1/d_k) d_k = 1 with the Jacobian split between V and Q/K.`,`R4: Write: (1) Var(q_i k_i)=1 => Var(q·k)=d_k; (2) Var(/√d_k)=1; (3) α(1-α)→0 kills Q/K gradients, while α_winner≈1 still passes gradient to W_V.`,`R5: Complete derivation: Independent unit-variance terms sum to variance d_k; dividing by √d_k scales variance by 1/d_k back to 1. Saturated softmax has zero derivative α(1-α)=0 for Q/K, but passes weight α=1 directly to the winning V.`]}}},{id:`quadratic-vs-linear-attention`,unitId:`u1-attention`,title:`Quadratic O(N²d) Bottleneck vs. Linear Attention Associativity`,statement:`Standard attention computes softmax(QK^T)V in O(N²d) because softmax couples all N×N token pairs before multiplying V; linear attention drops softmax to associate Q(K^T V) in O(N d²), trading sharp token-specific lookup for fixed-size summary compression.`,isUnconditionalTruth:!1,prerequisites:[`dot-product-alignment`,`scaled-variance-softmax`],examWeight:4,motivatedHook:`Why does doubling context length N quadruple attention compute, and what single mathematical barrier stops us from just multiplying K^T V first?`,predictionPrompt:{question:`In the product (Q K^T) V where Q, K, V ∈ R^{N × d}, why can’t standard Transformer attention simply use matrix associativity Q (K^T V) to reduce complexity from O(N²d) to O(Nd²)?`,options:[`Because the non-linear element-wise softmax(.) sits around softmax(Q K^T), preventing us from factoring K^T V first`,`Because matrix multiplication is never associative when N > d`,`Because V has a different sequence length N than K`,`Because GPUs cannot multiply d × N by N × d matrices`],correctIndex:0,resolution:`Spot on! Without softmax, (QK^T)V = Q(K^T V). The non-linear softmax(QK^T) forces materializing the N×N score matrix first unless we replace exp(q·k) with a separable kernel φ(q)φ(k)^T!`},teachingStep:{coreExplanation:`In standard attention, Q, K, V have shape (N × d). Forming S = QK^T produces an (N × N) matrix in O(N²d) time and O(N²) memory. If we replace softmax(q_i · k_j) with a decomposable feature map φ(q_i) · φ(k_j)^T, then by matrix associativity: (φ(Q) φ(K)^T) V = φ(Q) (φ(K)^T V). Here M = φ(K)^T V is a fixed (d × d) state matrix computed in O(N d²)! However, compressing N tokens into a fixed d × d matrix loses exact needle-in-a-haystack resolution when N ≫ d.`,visualMentalModel:`Standard: [Q (N×d) · K^T (d×N)] ──> Softmax (N×N) · V (N×d) ===> O(N²d) time, sharp exact retrieval
Linear:   φ(Q) (N×d) · [φ(K)^T (d×N) · V (N×d)] ──> State (d×d) ===> O(Nd²) time, lossy d×d bottleneck`,keyFormulaOrRule:`(φ(Q) φ(K)^T) V = φ(Q) (φ(K)^T V)  [O(N²d) ──> O(Nd²)]`,checkQuestion:{question:`What does Linear Attention sacrifice in exchange for reducing time complexity from O(N²d) to O(Nd²)?`,options:[{text:`All N historical key-value pairs are superposed into a fixed d×d matrix (φ(K)^T V), causing retrieval interference ("blurriness") when N exceeds capacity d.`,diagnosticFeedback:`Exactly—just like an RNN state of fixed size d×d, it cannot store arbitrarily many sharp, independent key-value associations without crosstalk.`},{text:`It can no longer run on parallel GPUs during training.`,misconceptionTag:`parallelism-myth`,diagnosticFeedback:`Linear attention is even faster to parallelize across chunks during training!`},{text:`It requires O(N^3) memory during inference.`,misconceptionTag:`memory-myth`,diagnosticFeedback:`Linear attention uses O(d^2) constant recurrent memory during inference!`}],correctIndex:0}},quizletStages:{recognition:{question:`Why does Linear Attention achieve O(N d²) complexity instead of O(N² d)?`,options:[{text:`It replaces non-linear softmax with a separable kernel φ(Q)φ(K)^T, allowing associative reordering φ(Q)(φ(K)^T V) where φ(K)^T V is a d×d matrix.`,misconception:`None`,explanation:`Associativity avoids ever constructing the N×N attention matrix.`},{text:`It randomly drops 90% of the tokens in the sequence before computing QK^T.`,misconception:`Confusing linear attention with token pruning.`,explanation:`Linear attention processes all N tokens via the associative product.`},{text:`It sets d = 1 for all heads.`,misconception:`Dimension collapse myth.`,explanation:`Head dimension d remains standard (e.g., 64 or 128).`},{text:`It computes QK^T in int4 precision while keeping O(N²) operations.`,misconception:`Confusing quantization with algorithmic complexity.`,explanation:`Quantization reduces constant factors, not asymptotic O(N²) scaling.`}],correctIndex:0},discrimination:{scenario:`You are designing an model that must copy an exact 16-digit UUID mentioned 50,000 tokens earlier ("needle in a haystack").`,confusableWith:`Full Softmax Attention vs. Pure Linear Attention (fixed d×d state)`,question:`Which architecture struggles on exact long-range copying and why?`,options:[{text:`Pure Linear Attention struggles because its fixed d×d state (φ(K)^T V) has finite rank ≤ d and lacks the exponential sharpness of softmax to isolate one exact past token out of 50,000.`,whyRightOrWrong:`Correct! Softmax can concentrate ~100% weight on a single token across N=50,000 because it keeps all N keys distinct; linear attention superposes them into d×d.`},{text:`Full Softmax Attention struggles because O(N²) matrices cannot represent identity mappings.`,whyRightOrWrong:`Full softmax attention excels at exact induction-head copying.`},{text:`Both fail equally because dot products cannot compare token embeddings.`,whyRightOrWrong:`Full attention solves needle-in-a-haystack reliably.`}],correctIndex:0},cuedRecall:{prompt:`Write the matrix parenthesization trick used by Linear Attention, its asymptotic complexity, and the fundamental representation tradeoff it makes.`,acceptedKeywords:[`associativ`,`d^2`,`nd^2`,`softmax`,`bottleneck`,`fixed`,`sharp`],canonicalAnswer:`Reorders (φ(Q)φ(K)^T)V to φ(Q)(φ(K)^T V) reducing O(N²d) to O(Nd²), trading sharp unbounded N×N lookup for a lossy fixed-size d×d state.`,hints:[`R0: Compare the matrix shapes of (QK^T)V vs. Q(K^T V).`,`R1: What is the shape of K^T V when K and V are both N × d?`,`R2: K^T V has shape d × d! What stops us from doing that in standard attention?`,`R3: Proposition: Replacing softmax with φ(Q)φ(K)^T unlocks associativity φ(Q)(φ(K)^T V) in O(Nd²), compressing history into a d×d state.`,`R4: State: (1) Associative product φ(Q)(φ(K)^T V), (2) O(Nd²) runtime, (3) lossy d×d superposition vs sharp softmax.`,`R5: Complete answer: Linear attention drops non-linear softmax for φ(Q)(φ(K)^T V), cutting complexity from O(N²d) to O(Nd²) at the cost of compressing all N tokens into a fixed d×d matrix.`]},application:{examProblem:`Derive the exact FLOP scaling of (QK^T)V versus Q(K^T V) for Q, K, V ∈ R^{N×d} when N = 32,768 and d = 64. Explain why standard attention cannot use the second order directly and how Linear Attention’s d×d state behaves like an RNN during inference.`,feynmanPrompt:`Explain why parentheses placement in matrix multiplication is the difference between a 10-second response and running out of GPU memory.`,requiredMoves:[{id:`m1`,label:`Calculate shapes & FLOPs: (QK^T)V forms an N×N intermediate taking ~2N²d ops, whereas Q(K^T V) forms a d×d intermediate taking ~2Nd² ops (512× fewer when N=32768, d=64)`,keywords:[`n^2`,`nd^2`,`d×d`,`n×n`,`512`,`shape`,`intermediate`]},{id:`m2`,label:`Explain that row-wise non-linear softmax(QK^T) prevents factoring K^T V unless replaced by a kernel feature map φ(q)φ(k)^T`,keywords:[`softmax`,`non-linear`,`kernel`,`separable`,`factor`]},{id:`m3`,label:`Show that during autoregressive inference, S_t = S_{t-1} + φ(k_t)v_t^T updates in O(d²) constant memory like an RNN, losing exact recall when N ≫ d`,keywords:[`recurrent`,`rnn`,`s_t`,`constant memory`,`lossy`,`superpos`]}],modelSolution:`1) For Q, K, V ∈ R^{N×d}: (QK^T) produces an N×N matrix in O(N²d) FLOPs, then multiplies V in O(N²d). By contrast, (K^T V) multiplies (d×N)(N×d) into a (d×d) matrix in O(Nd²), then Q(K^T V) takes O(Nd²). With N=32,768 and d=64, N/d = 512× faster! 2) Standard attention applies element-wise exp() and row normalization across QK^T, which does not factor across the matrix product. Linear attention substitutes φ(q_i)φ(k_j)^T. 3) At inference, the cumulative state S_t = Σ_{j≤t} φ(k_j) v_j^T ∈ R^{d×d} updates recurrently in O(d²) time and memory per token, but acts as a finite-capacity associative memory that blurs sharp lookups over long contexts.`,commonTraps:[`Writing that K^T V has shape N×N instead of d×d`,`Forgetting that recurrent inference memory in Linear Attention is O(d²), independent of N`],hints:[`R0: Write down the dimensions: Q is (N×d), K^T is (d×N), V is (N×d).`,`R1: Multiply K^T (d×N) by V (N×d) first. What is the resulting matrix shape and cost?`,`R2: Now divide N²d by Nd² for N=32768, d=64.`,`R3: Express the recurrent state S_t = S_{t-1} + φ(k_t)v_t^T and note its fixed d×d size.`,`R4: Combine all 3 moves: (1) O(N²d) vs O(Nd²) with N/d=512x ratio; (2) softmax blocks associativity; (3) O(d²) RNN state update & capacity limit.`,`R5: Full solution: (QK^T)V forms an N×N matrix in O(N²d); Q(K^T V) forms a d×d matrix in O(Nd²) (512x smaller). Softmax blocks factoring unless replaced by φ(Q)φ(K)^T, which gives an O(d²) recurrent state S_t that trades exact N-token recall for constant memory.`]}}},{id:`residual-gradient-highway`,unitId:`u2-training-inference`,title:`Residual Connections (x + F(x)) as Unimpeded Gradient Highways`,statement:`Because the derivative of y = x + F(x) with respect to x is I + ∂F/∂x, the identity term I guarantees that upstream gradients flow directly to early layers via addition even when ∂F/∂x vanishes.`,isUnconditionalTruth:!0,prerequisites:[],examWeight:5,motivatedHook:`In a 96-layer network without skip connections, multiplying 96 Jacobians less than 1 shrinks gradients to 0. What elementary operation has a derivative of 1.0 no matter how deep you stack it?`,predictionPrompt:{question:`If a layer computes y = x + F(x) instead of y = F(x), what is the Jacobian ∂y/∂x during backpropagation?`,options:[`I + ∂F/∂x — the identity matrix I plus the sublayer Jacobian, ensuring gradients can pass unmodified through the +1 branch`,`x · ∂F/∂x — the product of input and gradient`,`Only ∂F/∂x, because x is treated as a constant during backprop`,`Zero whenever F(x) saturates`],correctIndex:0,resolution:`Exactly! Addition is a gradient distributor: ∂(x + F(x))/∂x = I + ∂F/∂x. Even if ∂F/∂x = 0 in some layer, the identity term I carries the upstream gradient ∂L/∂y straight back!`},teachingStep:{coreExplanation:`In plain deep networks y_L = f_L(f_{L-1}(...f_1(x))), the chain rule multiplies Jacobians: ∂y_L/∂x = Π_{l=1}^L ∂f_l/∂x_{l-1}. If each spectral norm is 0.8 across 100 layers, 0.8^{100} ≈ 2×10^{-10} (vanishing gradient). With residual blocks x_l = x_{l-1} + F_l(x_{l-1}), unrolling from layer l to L gives x_L = x_l + Σ_{m=l+1}^L F_m(x_{m-1}). Differentiating yields ∂L/∂x_l = ∂L/∂x_L · (I + ∂/∂x_l Σ F_m). The direct additive term ∂L/∂x_L reaches layer l untouched by intermediate multiplicative decay!`,visualMentalModel:`Forward:  x_{l-1} ──┬───────────────(+)──> x_l = x_{l-1} + F(x_{l-1})

se exact end-to-end backpropagation.`},{text:`They replace matrix multiplications with max-pooling.`,misconception:`Architecture confusion.`,explanation:`Attention and FFN blocks still use dense linear projections.`}],correctIndex:0},discrimination:{scenario:`Compare Pre-LN Transformer blocks: x_l = x_{l-1} + F(LN(x_{l-1})) versus Post-LN blocks: x_l = LN(x_{l-1} + F(x_{l-1})).`,confusableWith:`Pre-LN vs. Post-LN residual stream gradient flow`,question:`Why does Pre-LN train stably at 100+ layers without a long learning-rate warmup while Post-LN struggles?`,options:[{text:`In Pre-LN, the main residual stream x_L = x_0 + Σ F_m(LN(x_{m-1})) has a pure, unnormalized identity path all the way from x_L to x_0, whereas Post-LN wraps every step in LayerNorm’s Jacobian.`,whyRightOrWrong:`Exact distinction! Pre-LN keeps the identity highway completely clean from output to input.`},{text:`Because Pre-LN uses fewer parameters in its LayerNorm layers.`,whyRightOrWrong:`Both use the exact same number of γ and β parameters.`},{text:`Because Post-LN cannot be differentiated on GPUs.`,whyRightOrWrong:`Both are fully differentiable; the difference is conditioning of the gradient highway.`}],correctIndex:0},cuedRecall:{prompt:`Write the forward equation and backward Jacobian of a residual block, and explain why Pre-LN preserves a cleaner gradient highway than Post-LN.`,acceptedKeywords:[`identity`,`i +`,`jacobian`,`addition`,`pre-ln`,`unimpeded`,`vanish`],canonicalAnswer:`Forward: y = x + F(x); Backward Jacobian: ∂y/∂x = I + ∂F/∂x. Pre-LN keeps LayerNorm inside F(LN(x)) so the main skip stream remains a pure identity sum from x_L to x_0.`,hints:[`R0: Differentiate y = x + F(x) with respect to x.`,`R1: What is ∂x/∂x in vector calculus?`,`R2: It is the Identity matrix I! Now compare where LayerNorm sits in Pre-LN vs Post-LN.`,`R3: Proposition: ∂(x + F(x))/∂x = I + ∂F/∂x; Pre-LN places LN on the branch F(LN(x)) so the skip path stays a pure identity highway.`,`R4: Write: (1) y = x + F(x), (2) ∂y/∂x = I + ∂F/∂x, (3) Pre-LN avoids multiplying by ∂LN/∂x along the main trunk.`,`R5: Complete answer: Residual blocks compute y = x + F(x) with Jacobian I + ∂F/∂x, transmitting upstream gradients via I even when ∂F/∂x vanishes. Pre-LN keeps LN inside the branch so the trunk is a pure identity sum.`]},application:{examProblem:`Unroll the recurrence x_l = x_{l-1} + F_l(x_{l-1}) from layer l to final layer L, derive ∂L/∂x_l in terms of ∂L/∂x_L, and explain why initializing the final projection of each block F_l near zero helps deep Transformer stability.`,feynmanPrompt:`Explain how a residual connection acts like an express elevator for error signals in a 100-story skyscraper.`,requiredMoves:[{id:`m1`,label:`Unroll telescoping sum: x_L = x_l + Σ_{m=l+1}^L F_m(x_{m-1})`,keywords:[`unroll`,`sum`,`x_l`,`x_L`,`sigma`]},{id:`m2`,label:`Differentiate via chain rule: ∂L/∂x_l = ∂L/∂x_L · (I + ∂/∂x_l Σ F_m)`,keywords:[`chain rule`,`identity`,`∂l/∂x`,`derivative`,`i +`]},{id:`m3`,label:`Explain Zero-Init: when F_m ≈ 0 at start of training, x_L ≈ x_0 and ∂x_L/∂x_l ≈ I, so every layer receives clean, unit-scale gradients immediately`,keywords:[`zero`,`init`,`unit`,`scale`,`clean`,`preserve`]}],modelSolution:`1) By telescoping addition, x_L = x_l + Σ_{m=l+1}^L F_m(x_{m-1}). 2) Applying the chain rule from loss L: ∂L/∂x_l = (∂L/∂x_L)(∂x_L/∂x_l) = ∂L/∂x_L + (∂L/∂x_L) · ∂/∂x_l [Σ_{m=l+1}^L F_m(x_{m-1})]. 3) Because ∂L/∂x_L appears additively outside the residual sum, gradients cannot vanish even if the second term is small. Initializing the output projection of each F_m near zero makes ∂F_m/∂x ≈ 0 at step 0, so the entire 100-layer network initially acts like the identity map (∂x_L/∂x_l = I) and every layer receives well-conditioned gradients from the very first batch.`,commonTraps:[`Writing ∂x_L/∂x_l as a product of F_m rather than I + ∂(Σ F_m)/∂x_l`,`Confusing zero-initializing the output projection of F_l with zero-initializing all weights (which would kill symmetry breaking)`],hints:[`R0: Write x_{l+1} = x_l + F_{l+1}(x_l), then substitute into x_{l+2}, up to x_L.`,`R1: Differentiate x_L = x_l + Σ F_m with respect to x_l.`,`R2: Notice the first term ∂x_l/∂x_l = I!`,`R3: Now evaluate I + ∂(Σ F_m)/∂x_l when the last linear layer of each F_m is initialized to 0.`,`R4: State all 3 parts: (1) x_L = x_l + Σ F_m; (2) ∂L/∂x_l = ∂L/∂x_L (I + ∂ΣF/∂x_l); (3) Zero-init makes Jacobian ≈ I at step 0.`,`R5: Complete derivation: Unrolling gives x_L = x_l + Σ F_m. Differentiating gives ∂L/∂x_l = ∂L/∂x_L (I + ∂ΣF/∂x_l), preserving the direct ∂L/∂x_L term. Near-zero output init of F_m sets the Jacobian close to I so deep networks train stably from step 1.`]}}},{id:`kv-cache-roofline`,unitId:`u2-training-inference`,title:`KV Caching & The Memory-Bandwidth Decoding Roofline`,statement:`Because causal masking prevents future tokens from altering past Keys and Values, caching K_{1..t-1} and V_{1..t-1} reduces per-token decoding compute from O(t²d) to O(td), shifting the bottleneck from GPU FLOPs to HBM memory bandwidth.`,isUnconditionalTruth:!1,prerequisites:[`dot-product-alignment`,`residual-gradient-highway`],examWeight:4,motivatedHook:`When generating token #1000, why would we recompute the Keys and Values for tokens 1..999 if causal masking guarantees they can never see token #1000 anyway?`,predictionPrompt:{question:`In a causal (decoder-only) Transformer, when token t arrives during generation, do the hidden representations, Keys, or Values of earlier tokens 1..t-1 change?`,options:[`No — because causal masking blocks tokens 1..t-1 from attending to token t, their K and V vectors are invariant and can be cached once`,`Yes — every earlier token must update its Key to include token t`,`Only the Queries of tokens 1..t-1 are needed to compute token t’s output`,`Only the final layer can be cached because earlier layers are bidirectional`],correctIndex:0,resolution:`Spot on! Causal masking makes tokens 1..t-1 strictly a function of prefix 1..t-1. So we only compute q_t, k_t, v_t for the new token, append (k_t, v_t) to the KV cache, and dot q_t against K_{1..t}!`},teachingStep:{coreExplanation:`To emit token t+1, we only need the final output at position t: y_t = Σ_{j=1}^t softmax(q_t · k_j / √d_k) v_j. Notice that q_1..q_{t-1} are never used again! Only k_1..k_t and v_1..v_t are needed. By storing K and V in GPU High-Bandwidth Memory (KV Cache), step t performs a vector-matrix product q_t K_{1..t}^T in O(td) FLOPs instead of recomputing the full prefix in O(t²d). However, because each weight matrix and KV cache entry is loaded from HBM just to process a single vector q_t (batch=1), arithmetic intensity (FLOPs per byte loaded) is ~1–2, making decoding strictly memory-bandwidth bound!`,visualMentalModel:`Without KV Cache (Step t): Recompute Q,K,V for all t tokens ──> O(t²d) FLOPs
With KV Cache (Step t):    Compute ONLY q_t, k_t, v_t ──> Append [k_t, v_t] to Cache ──> q_t · K_{1..t}^T ──> O(td) FLOPs (Memory-Bandwidth Bound!)`,keyFormulaOrRule:`KV Cache Bytes = 2 (K & V) × L (layers) × n_kv_heads × d_head × N (tokens) × bytes_per_param`,checkQuestion:{question:`Why don’t we also cache the past Query vectors Q_{1..t-1} in the KV cache during autoregressive generation?`,options:[{text:`Because at generation step t, we only compute the output representation for position t (using q_t against K_{1..t} and V_{1..t}); past outputs y_{1..t-1} are already finalized.`,diagnosticFeedback:`Exactly! Query q_j was only needed at step j to produce token j+1.`},{text:`Because Queries are 100× larger than Keys in memory.`,misconceptionTag:`size-confusion`,diagnosticFeedback:`q_j and k_j have the exact same dimension d_k.`},{text:`Because Queries change retroactively when future tokens are generated.`,misconceptionTag:`causality-confusion`,diagnosticFeedback:`In a causal decoder, past Queries never change either—they are simply no longer needed!`}],correctIndex:0}},quizletStages:{recognition:{question:`What is the exact formula for KV Cache memory size (in bytes) for a single sequence of length N across L layers?`,options:[{text:`2 × L × n_kv_heads × d_head × N × bytes_per_element (where the factor of 2 accounts for both K and V).`,misconception:`None`,explanation:`Each token stores one Key and one Value vector per KV head per layer.`},{text:`3 × L × N² × bytes_per_element (storing Q, K, and the N×N attention matrix).`,misconception:`Thinking Q and the N×N attention matrix are cached.`,explanation:`Neither Q nor the N×N attention weights are persisted across steps.`},{text:`L × vocab_size × bytes_per_element.`,misconception:`Confusing KV cache with output logits.`,explanation:`KV cache scales with hidden dimension and sequence length N, not vocabulary size.`},{text:`It is constant O(1) with respect to sequence length N.`,misconception:`Confusing Transformer KV cache with RNN state.`,explanation:`Transformer KV cache grows linearly O(N) with sequence length.`}],correctIndex:0},discrimination:{scenario:`Compare the Prefill phase (processing a 4,000-token user prompt all at once) against the Decode phase (generating 200 answer tokens one by one with a KV cache).`,confusableWith:`Compute-bound Prefill (Matrix-Matrix) vs. Memory-Bandwidth-bound Decode (Vector-Matrix)`,question:`Why is Prefill compute-bound (FLOP-limited) while Decode is memory-bandwidth-bound on modern GPUs?`,options:[{text:`Prefill processes 4,000 tokens simultaneously (matrix-matrix multiply, reusing loaded weights 4,000 times), whereas Decode loads all model weights + KV cache from HBM just to multiply a single token vector (arithmetic intensity ~1 FLOP/byte).`,whyRightOrWrong:`Exact Roofline analysis! Weight reuse across N=4,000 tokens gives high arithmetic intensity; single-token decoding starves the tensor cores waiting on HBM reads.`},{text:`Because Prefill runs on the CPU while Decode runs on the GPU.`,whyRightOrWrong:`Both Prefill and Decode run on the GPU.`},{text:`Because KV caching increases the total FLOPs of the Decode phase.`,whyRightOrWrong:`KV caching drastically reduces FLOPs, which is precisely why FLOPs are no longer the bottleneck!`}],correctIndex:0},cuedRecall:{prompt:`State why causal masking makes KV caching valid, why Queries are not cached, and why grouped-query attention (GQA) speeds up decoding.`,acceptedKeywords:[`causal`,`query`,`bandwidth`,`memory`,`k and v`,`gqa`,`head`],canonicalAnswer:`Causal masking ensures past K/V never depend on future tokens; past Queries are unneeded since only position t is decoded; GQA shares fewer KV heads across Query heads to shrink HBM bandwidth reads.`,hints:[`R0: Think about what position t needs to compute y_t, and what the GPU waits on during decoding.`,`R1: Why don’t k_1..k_{t-1} change when token t arrives? Why don’t we need q_1..q_{t-1}?`,`R2: Since decoding is memory-bandwidth bound, what happens if 8 Query heads share 1 Key-Value head (GQA)?`,`R3: Proposition: Causal masking freezes past K/V; only q_t is active at step t; GQA cuts KV cache size & HBM traffic by sharing KV heads.`,`R4: Write: (1) Causal mask => invariant past K/V; (2) Only q_t needed for step t; (3) GQA reduces n_kv_heads to relieve HBM bandwidth.`,`R5: Complete answer: Causal masking keeps past K/V fixed; past Queries aren’t needed because only y_t is computed; GQA shares KV heads across multiple Query heads, slashing KV cache memory and HBM bandwidth.`]},application:{examProblem:`Calculate the KV cache size in GB for a 32-layer model with 32 Query heads, 8 KV heads (GQA), head dimension d_head = 128, sequence length N = 16,384, and fp16 (2 bytes/element). How much memory did 8-head GQA save compared to Multi-Head Attention (32 KV heads)?`,feynmanPrompt:`Walk through the exact byte math of a KV cache and explain why shrinking it makes tokens stream 4x faster on a laptop or GPU.`,requiredMoves:[{id:`m1`,label:`Apply formula: 2 × 32 layers × 8 kv_heads × 128 d_head × 16,384 tokens × 2 bytes`,keywords:[`2 * 32`,`2 × 32`,`128`,`16384`,`16,384`,`formula`]},{id:`m2`,label:`Compute result: 2,147,483,648 bytes = 2.0 GiB (approx 2.15 GB)`,keywords:[`2 gb`,`2.0`,`2.15`,`2 gib`,`billion`]},{id:`m3`,label:`Compare to MHA (32 KV heads): MHA would take 8.0 GiB, so GQA (8 KV heads) saves 4× (6.0 GiB) and cuts HBM memory-bandwidth read time by 4×`,keywords:[`4x`,`4×`,`8 gb`,`8.0`,`6 gb`,`bandwidth`,`mha`]}],modelSolution:`1) Per token per layer: 2 (K and V) × 8 KV heads × 128 d_head × 2 bytes (fp16) = 4,096 bytes (4 KB). 2) Across 32 layers and N = 16,384 tokens: 4,096 × 32 × 16,384 = 2,147,483,648 bytes = 2.0 GiB (2.15 GB). 3) Standard MHA with 32 KV heads would require 4 × 2.0 GiB = 8.0 GiB. Thus 8-head GQA saves 6.0 GiB (75% reduction) and reduces KV cache HBM bandwidth reads per decoded token by 4×.`,commonTraps:[`Multiplying by 32 Query heads instead of 8 KV heads`,`Forgetting the factor of 2 for storing both Keys AND Values`],hints:[`R0: Use: Bytes = 2 (K,V) × L × n_kv_heads × d_head × N × 2 bytes.`,`R1: First compute bytes per token per layer: 2 × 8 × 128 × 2 = 4,096 bytes.`,`R2: Multiply 4,096 bytes × 32 layers × 16,384 tokens.`,`R3: Note 4,096 = 2^{12}, 32 = 2^5, 16,384 = 2^{14}, so total is 2^{31} bytes = 2.0 GiB! Compare 8 KV heads vs 32 KV heads.`,`R4: Write: (1) Formula substitution, (2) 2.0 GiB total, (3) 4x reduction vs 8.0 GiB MHA.`,`R5: Complete answer: 2 × 32 × 8 × 128 × 16,384 × 2 = 2.0 GiB (2.15 GB). Compared to 32-head MHA (8.0 GiB), GQA cuts KV cache size and HBM bandwidth by 4× (saving 6.0 GiB).`]}}},{id:`harness-state-separation`,unitId:`u3-agent-harnesses`,title:`Agent Harness State Separation & Single-Step Verification`,statement:`A high-reliability agent harness externalizes durable state (knowledge graph, plan, rubric) outside the chat stream and verifies each atomic reasoning step before building downstream steps on top of it.`,isUnconditionalTruth:!0,prerequisites:[],examWeight:4,motivatedHook:`Why did changing only the agent harness (with the exact same LLM weights) jump a coding/tutoring agent from 30th place to Top 5 on Terminal-Bench?`,predictionPrompt:{question:`If an AI agent executes 10 dependent steps in one unchecked monologue and step 2 contains a subtle flaw, what happens to steps 3 through 10?`,options:[`Errors compound exponentially: steps 3–10 build on the corrupted premise from step 2, wasting tokens and poisoning the context window`,`Step 10 automatically cancels out the error in step 2`,`The model’s temperature resets to zero after step 2`,`Nothing changes because LLMs do not condition on their own prior output tokens`],correctIndex:0,resolution:`Spot on! Because autoregressive models condition on their own generated tokens, an unchecked error in step 2 corrupts every subsequent step. A harness checks each landing immediately!`},teachingStep:{coreExplanation:`In both coding harnesses (Claude Code, Codex) and learning harnesses (LearnHarness), the model is wrapped in an explicit control loop: (1) Instructions & Context (CLAUDE.md / AGENTS.md), (2) Persistent Structured Memory (e.g., a proposition-and-premise Knowledge Graph stored on disk so sessions stay short and cheap), (3) Minimal Dependency Planning (pruning already-held nodes), and (4) Single-Step Execution with Verification Gates (checking each step before advancing). Localizing errors at step k means repairing 1 node instead of regenerating an entire corrupted trajectory.`,visualMentalModel:`Unchecked Monologue: Step 1 ──> Step 2 (Error!) ──> Step 3 (Corrupted) ──> Step 4 (Hallucinated) [High Token Waste]
Harness Loop:        Probe Edge ──> Minimal Plan ──> Step k ──> Check Gate ──> (If Miss: Surgical Repair) ──> Update Graph`,keyFormulaOrRule:`P(N-step trajectory succeeds unchecked) = p^N   vs.   Step-verified with repair: 1 - (1 - p)^k_retries per step`,checkQuestion:{question:`Why does an effective learning harness store learned propositions in a compact external Knowledge Graph rather than keeping one giant endless chat transcript?`,options:[{text:`Long transcripts bloat token cost per turn (O(T²)) and degrade attention focus ("context rot"), whereas a compact graph shares only the relevant prerequisite structure across fresh sessions.`,diagnosticFeedback:`Exactly—compacting sessions into structured propositions keeps every new session fast, cheap, and sharply focused.`},{text:`Because JSON files execute Python code automatically without a CPU.`,misconceptionTag:`json-execution-myth`,diagnosticFeedback:`JSON is passive structured data read into the prompt context selectively.`},{text:`Because LLMs cannot read more than 50 words per prompt.`,misconceptionTag:`context-limit-exaggeration`,diagnosticFeedback:`Modern LLMs have large context windows, but filling them with raw chat logs wastes money and hurts retrieval precision.`}],correctIndex:0}},quizletStages:{recognition:{question:`What are the core architectural components that distinguish an Agent Harness from a raw LLM chat window?`,options:[{text:`Persistent external memory (knowledge graph), dependency planning (minimal tree), tool/check verification gates after each step, and context compaction.`,misconception:`None`,explanation:`The harness controls context, tools, verification, and memory around the model.`},{text:`Modifying the floating-point weights of the neural network on every user keystroke.`,misconception:`Confusing harness engineering with online weight fine-tuning.`,explanation:`Harnesses operate at inference time through context, state, and control loops without mutating model weights.`},{text:`Replacing the tokenizer with an HTML parser.`,misconception:`Tokenizer confusion.`,explanation:`The model still uses its native tokenizer.`},{text:`Disabling all system prompts so the model guesses what to do.`,misconception:`Opposite of harness design.`,explanation:`Harnesses rely on disciplined, modular system prompts and state contracts.`}],correctIndex:0},discrimination:{scenario:`During a practice session, a student asks for a hint. Tutor A immediately prints the full worked solution and moves to the next question. Tutor B checks the student’s thinking trace, identifies the first broken step, and gives an R1 pattern nudge.`,confusableWith:`Answer-dumping chatbot vs. Harness-enforced Minimal Hint Ladder (R0–R5)`,question:`Why does Tutor A destroy the learning yield of the practice problem?`,options:[{text:`Revealed information cannot be unrevealed: dumping the full solution surrenders the retrieval and execution events, producing an illusion of competence (familiarity) instead of unaided recall.`,whyRightOrWrong:`Exact LearnHarness Practice Doctrine: strengthening only comes from retrieval that succeeds with effort!`},{text:`Because printing a full solution uses fewer tokens than printing a short R1 nudge.`,whyRightOrWrong:`Actually, a short R1 surgical nudge uses far *fewer* output tokens AND preserves learning!`},{text:`Because students never read full solutions.`,whyRightOrWrong:`Students read them and nod along ("that makes sense"), which is the classic familiarity trap.`}],correctIndex:0},cuedRecall:{prompt:`Name the four stages of the LearnHarness loop, explain why checks happen after every single reasoning step, and state the Inactivity Constraint in practice.`,acceptedKeywords:[`probe`,`plan`,`teach`,`practice`,`single step`,`inactivity`,`interleav`],canonicalAnswer:`Probe -> Plan -> Teach -> Practice; single-step checks catch and repair misconceptions before downstream steps build on them; the Inactivity Constraint requires interleaving so propositions must be retrieved cold.`,hints:[`R0: Recall the 4 stages from measuring understanding to drilling retrieval.`,`R1: Stage 1 brackets what you know; Stage 2 builds the minimal tree; Stage 3 steps through it; Stage 4 drills it.`,`R2: Why check after *every* reasoning step instead of at the end of a 5-step lecture?`,`R3: Proposition: Probe -> Plan -> Teach -> Practice; per-step checks localize errors immediately; practice interleaves topics so the target proposition starts inactive.`,`R4: Write: (1) Probe, Plan, Teach, Practice; (2) Single-step checks prevent building on broken foundations; (3) Inactivity constraint = target must not already be active in working memory.`,`R5: Complete answer: The 4 stages are Probe, Plan, Teach, and Practice. Checking every step catches errors immediately before corrupting later derivations, and the Inactivity Constraint interleaves problems so concepts are retrieved cold.`]},application:{examProblem:`Suppose a student has a 20% chance of misunderstanding any single reasoning step (p = 0.80 success per step). Compare a 5-step monolithic explanation (checked only at the end) against a 5-step harness loop that checks and repairs each step immediately. How does this also reduce token waste?`,feynmanPrompt:`Explain mathematically why checking every small step beats lecturing for 2 pages and asking "Got it?" at the end.`,requiredMoves:[{id:`m1`,label:`Compute monolithic success probability: 0.80^5 = 0.3277 (~33% chance the whole 5-step chain lands cleanly)`,keywords:[`0.8`,`0.32`,`33%`,`32.8%`,`power`,`monolithic`]},{id:`m2`,label:`Explain that in a monolithic lecture, a failure at step 2 invalidates steps 3, 4, and 5, whereas per-step checking localizes and repairs step 2 before step 3 is taught`,keywords:[`localize`,`repair`,`corrupt`,`step 2`,`before`,`foundation`]},{id:`m3`,label:`Connect to token efficiency: short node-scoped turns + external graph memory avoid re-sending and re-generating long failed explanations`,keywords:[`token`,`cost`,`graph`,`short`,`waste`,`context`]}],modelSolution:`1) In a 5-step unchecked lecture where each step lands independently with probability p = 0.80, the probability that all 5 steps land is 0.80^5 = 0.32768 (~32.8%—meaning 67.2% of sessions fail!). 2) Worse, when step 2 fails, steps 3–5 are built on a broken premise, so the learner cannot even tell *where* they got lost. Per-step checking verifies step 2 immediately and repairs it with a 1-line surgical nudge before advancing. 3) By storing verified propositions in an external Knowledge Graph and keeping turns short, the harness avoids regenerating multi-paragraph lectures and keeps prompt context compact.`,commonTraps:[`Adding probabilities instead of multiplying 0.80^5 for sequential dependent steps`,`Forgetting that an unrepaired failure at step 2 makes steps 3–5 impossible to absorb`],hints:[`R0: Calculate 0.8^5 for 5 dependent steps landing without error.`,`R1: What is 0.8 × 0.8 × 0.8 × 0.8 × 0.8?`,`R2: It is 0.3277 (~33%). That means 2 out of 3 times, a 5-step monologue fails!`,`R3: Now contrast repairing a single step vs. debugging where a 5-step chain broke, and how external graph state saves tokens.`,`R4: State: (1) 0.8^5 ≈ 32.8% monolithic success; (2) per-step check localizes failure immediately; (3) graph compaction prevents token bloat.`,`R5: Complete answer: Unchecked 5-step lectures succeed only 0.8^5 ≈ 32.8% of the time and corrupt steps after the first miss. Per-step verification repairs each link immediately and stores verified claims in a compact graph, slashing wasted tokens.`]}}}]},{id:`bio-premed-energetics`,code:`BIO 202 / MCAT`,title:`Cellular Energetics, Enzyme Kinetics & Membrane Potentials`,institutionTag:`Pre-Med & Biochemistry · Exam Pack`,examTitle:`Midterm 2: Thermodynamics, Michaelis-Menten & Electrophysiology`,description:`High-yield pre-med mastery pack covering Gibbs Free Energy vs. Kinetics, Competitive vs. Non-Competitive Inhibition, Chemiosmotic Uncouplers, and the Nernst/Goldman equations.`,lastUpdated:`2026-11-09`,units:[{id:`u1-kinetics`,number:1,title:`Unit 1: Bioenergetics & Michaelis-Menten Kinetics`,subtitle:`Thermodynamic spontaneity (ΔG) versus catalytic rate (E_a, K_m, V_max)`,examSharePercent:55,primingSummary:`Never confuse WHETHER a reaction wants to happen (thermodynamics: ΔG, K_eq) with HOW FAST it happens (kinetics: activation barrier E_a, enzymes). Enzymes are pure speed catalysts—they never alter ΔG!`,unconditionalTruthSummary:`ΔG depends ONLY on the free-energy difference between final products and initial reactants; an enzyme lowers the transition-state activation barrier E_a equally in both directions.`},{id:`u2-membranes`,number:2,title:`Unit 2: Chemiosmotic Coupling & Membrane Potentials`,subtitle:`Proton-motive force in mitochondria and Nernst equilibrium across ion channels`,examSharePercent:45,primingSummary:`Both ATP synthesis and neuronal action potentials run on the same physical engine: storing potential energy as an electrochemical ion gradient across an impermeable lipid bilayer.`,unconditionalTruthSummary:`Ions flow spontaneously down their electrochemical gradient until the electrical voltage across the membrane exactly balances the chemical concentration gradient (Nernst equilibrium).`}],nodes:[{id:`delta-g-vs-activation-energy`,unitId:`u1-kinetics`,title:`Thermodynamics (ΔG, K_eq) vs. Catalytic Kinetics (E_a)`,statement:`An enzyme stabilizes the high-energy transition state to lower activation energy E_a (accelerating both forward and reverse rates equally), but never changes ΔG or the equilibrium constant K_eq.`,isUnconditionalTruth:!0,prerequisites:[],examWeight:5,motivatedHook:`Glucose oxidation (ΔG°' = -2870 kJ/mol) is massively spontaneous, yet a bowl of sugar sits on your table for years without bursting into flames. Why doesn’t a negative ΔG mean a fast reaction?`,predictionPrompt:{question:`If a biochemical reaction has ΔG = +15 kJ/mol (endergonic / uphill), what happens if you add a 10× concentration of a highly specific enzyme (with no ATP coupled)?`,options:[`Nothing changes in the net direction — the enzyme cannot make an uphill (+ΔG) reaction spontaneous; it only helps the system reach its existing equilibrium faster`,`The enzyme flips ΔG from +15 kJ/mol to -15 kJ/mol so the reaction proceeds forward`,`The enzyme increases K_eq by 10×`,`The enzyme gets consumed as a reactant to supply the missing 15 kJ/mol`],correctIndex:0,resolution:`Spot on! ΔG = G_products - G_reactants is a state function. Because an enzyme does not change the energy of reactants or products, it cannot change ΔG or K_eq = exp(-ΔG°/RT)!`},teachingStep:{coreExplanation:`Gibbs free energy ΔG = G_products - G_reactants determines spontaneity (ΔG < 0) and equilibrium ratio K_eq = [P]_eq/[S]_eq = e^{-ΔG°/RT}. Activation energy E_a = G_{transition}^ddagger - G_{reactants} is the hill between them. An enzyme’s active site binds the *transition state* more tightly than the ground-state substrate, lowering G_{transition}^ddagger. Because the ceiling drops by ΔE_a while both floors (G_reactants and G_products) stay fixed, both forward and reverse rate constants k_f and k_r increase by the exact same factor e^{ΔE_a/RT}, leaving K_eq = k_f / k_r completely unchanged!`,visualMentalModel:`Energy ^       ..--.. (Uncatalyzed Transition State E_a)
